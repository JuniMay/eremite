[package]
name = "eremite-server"
version = "0.1.0"
edition = "2024"
description = "eremite's HTTP server over the engine's C interface, src/eremite.h"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false }
deepseek-recipe = "=0.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
