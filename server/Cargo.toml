[package]
name = "eremite-server"
version = "0.1.0"
edition = "2024"
description = "eremite's HTTP server over the engine's C interface, src/eremite.h"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
deepseek-recipe = "=0.2.0"
# The connections and their limits (http.rs): hyper's HTTP/1 server under axum.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "server-graceful", "service", "tokio"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
